name: CI

# JVM-only CI: unit tests, the deterministic Arabic eval and Android lint. Device tests and
# screenshot regression need an emulator, so they run locally against the Nawa_Phone AVD
# (scripts/ui-regression.ps1, docs 07 + docs 26). No secrets or keystore material are needed
# here: a checkout without keystore.properties builds an unsigned release by design.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-tests:
    name: JVM unit tests (libre debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Run all JVM unit tests
        run: ./gradlew :app:testLibreDebugUnitTest testDebugUnitTest --console=plain
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jvm-test-results
          path: "**/build/test-results/**/*.xml"
          if-no-files-found: ignore

  arabic-eval:
    name: Arabic eval
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Run the Arabic eval (normalisation, sentences, BM25, negative controls)
        run: ./gradlew :core:rag:testDebugUnitTest --tests "app.sirrak.core.rag.ArabicEvalTest" --console=plain
      - name: Upload Arabic eval report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arabic-eval-report
          path: core/rag/build/test-results/testDebugUnitTest/TEST-app.sirrak.core.rag.ArabicEvalTest.xml
          if-no-files-found: ignore

  lint:
    name: Android lint (libre debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Run Android lint
        run: ./gradlew :app:lintLibreDebug --console=plain
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore

  public-site:
    name: Public site (build, validate, committed output)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the site from the data files
        shell: pwsh
        run: ./scripts/build-site.ps1
      - name: Validate the generated site
        shell: pwsh
        run: ./scripts/validate-site.ps1
      - name: Fail when website/dist is out of date
        run: git diff --exit-code --stat -- website/dist
