name: Deploy public site to GitHub Pages

# Generated from website/site.json + website/content/*.json by scripts/build-site.ps1, validated by
# scripts/validate-site.ps1, then published as a Pages artifact. Nothing here needs secrets.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the site from the data files
        shell: pwsh
        run: ./scripts/build-site.ps1
      - name: Validate the generated site
        shell: pwsh
        run: ./scripts/validate-site.ps1
      - name: Fail when website/dist is out of date
        run: git diff --exit-code --stat -- website/dist
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: website/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
