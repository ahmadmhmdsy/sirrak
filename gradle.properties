org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# compileSdk 36 on AGP 8.8: the API 36 platform is installed and builds fine, but AGP 8.8's
# support table stops at 35. AGP 8.9+ needs Gradle 8.11.1; we stay on the pinned 8.10.2 toolchain
# until the toolchain upgrade is its own change. Revisit when Gradle is bumped.
android.suppressUnsupportedCompileSdk=36
