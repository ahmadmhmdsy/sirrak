# F-Droid metadata for Sirrak, ready to copy into the fdroiddata repository
# (metadata/app.sirrak.yml). F-Droid rebuilds and signs the APK with its own key; the URLs and the
# commit below point at the published repository and its v1.0.0-rc1 tag.
#
# Prebuilt-AAR caveat, read this before submitting:
# engine/whisper/libs/sherpa-onnx-2.0.1.aar is a prebuilt binary vendored into this repository.
# F-Droid cannot build from a prebuilt AAR, so a source build of sherpa-onnx
# (https://github.com/k2-fsa/sherpa-onnx) has to replace it before a submission is made. Until that
# happens this file is a documented draft of the recipe, not an accepted one.
#
# Why this app is F-Droid-friendly:
# - Apache-2.0 source, no proprietary dependencies, no Google Play services in the libre flavour.
# - No telemetry, analytics, ads or accounts; the only network call is a user-initiated model
#   download from Hugging Face, plus a local-only network audit of that call.
# - Everything else (chat, dictation, retrieval, model manager) runs on device.
#
# Anti-feature "NonFreeNet": the only remote service is Hugging Face, which F-Droid classifies as a
# non-free network service. This is declared honestly instead of hidden; users can still use the app
# fully offline by importing a GGUF/LiteRT model file from local storage.

